name: Deploy

on:
  push:
    branches: [main]      # fusion dans main : test + build + deploy
  pull_request:
    branches: [main]      # PR vers main : test seulement

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/buzzy002/realtimechat
  APP_DIR: RealTimeChat   # dossier de manage.py, pour les tests

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    env:
      DJANGO_SECRET_KEY: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install ruff && ruff check --select E9,F63,F7,F82 .
      - run: python manage.py check --deploy --fail-level ERROR
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  build:
    needs: [test, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .   # racine du repo : le Dockerfile a besoin de app-client/ et RealTimeChat/
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          script_stop: true
          script: |
            cd /srv/realtimechat
            docker compose pull web
            docker compose run --rm web python manage.py migrate --noinput
            docker compose up -d
            docker image prune -af --filter "until=168h"